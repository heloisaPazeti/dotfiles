# ── Atalho: liga/desliga a status bar ──────────────────────
bind b set status

# ── Paleta ─────────────────────────────────────────────────
set -g @bg     '#1C1E26'
set -g @fg     '#D5D8DA'
set -g @muted  '#6B6D8F'
set -g @red    '#E95678'
set -g @yellow '#FAB795'
set -g @purple '#B877DB'

# ── Status bar ─────────────────────────────────────────────
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify absolute-centre   # centraliza de verdade (tmux >= 3.2)
set -g status-style "bg=default,fg=#{@fg}"
set -g status-left-length 40
set -g status-right-length 40
set -g window-status-current-style "none,nounderscore"

# Esquerda: roxo normal, vermelho quando o prefix está ativo
set -g status-left "#[fg=#{@muted}] • #[fg=#{?client_prefix,#{@red},#{@purple}}] #[fg=#{@purple}]#h "

# Direita: nome da sessão
set -g status-right "#[fg=#{@purple}]#S #[fg=#{@muted}]• "

# ── Janelas ────────────────────────────────────────────────
set -g window-status-separator " "
set -g window-status-style "fg=#{@muted},bg=default"
set -g window-status-format "#[fg=#{@muted}] #I #[fg=#{@fg}]#W "
set -g window-status-current-format "#[fg=#{@purple},bg=default]#[fg=#{@fg},bg=#{@purple},bold] #{?window_zoomed_flag,󰋱,#I} #[fg=#{@bg}]#W #[fg=#{@purple},bg=default,nobold]"

# ── Panes, mensagens e modo de cópia ───────────────────────
set -g pane-border-style "fg=#{@muted}"
set -g pane-active-border-style "fg=#{@purple}"
set -g message-style "bg=default,fg=#{@fg},bold"
set -g message-command-style "bg=default,fg=#{@fg},bold"
set -g mode-style "bg=#{@purple},fg=#{@bg},bold"

# ── Alertas (silenciosos) ──────────────────────────────────
set -g monitor-activity off
set -g visual-activity off
set -g bell-action none

# ── Terminal / cores ───────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
